[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Prerendered route folders are served first; everything else falls back to the SPA.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
